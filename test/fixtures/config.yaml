server:
  port: 4000

keys:
  - name: work-key
    value: test-work-key-value
  - name: personal-key
    value: test-personal-key-value

providers:
  - name: openrouter
    type: openrouter
    api_key: test-openrouter-key

  - name: openrouter-personal
    type: openrouter
    api_key: test-openrouter-personal-key

  - name: openai-main
    type: openai
    api_key: test-openai-key

  - name: copilot-main
    type: github_copilot

models:
  # Multi-deployment: same name, different providers and keys
  - provider: openrouter
    keys:
      - work-key
    models:
      - name: deepseek-v4-flash
        model: deepseek/deepseek-chat
      - work-only:gpt-4o-mini

  - provider: openrouter-personal
    priority: 10
    keys:
      - personal-key
    models:
      - deepseek-v4-flash:deepseek/deepseek-chat

  - provider: openrouter-personal
    keys:
      - personal-key
    models:
      - ds-flash-personal:deepseek/deepseek-chat
      - glm-5-turbo:glm/glm-5-turbo


  - provider: openai-main
    keys:
      - personal-key
    priority: 5
    models:
      - deepseek-v4-flash:gpt-4o-mini
      - tied-model:gpt-4o-mini

  - provider: openrouter-personal
    keys:
      - personal-key
    models:
      - tied-model:deepseek/deepseek-chat
  - provider: openai-main
    models:
      - gpt-4o-mini
      - gpt-4o-alias:gpt-4o-mini

  - provider: copilot-main
    keys:
      - work-key
    models:
      - copilot-test:gpt-5.6-terra

fallbacks:
  deepseek-v4-flash:
    - gpt-4o-mini
  glm-5-turbo:
    - ds-flash-personal
  work-only:
    - copilot-test
  copilot-test:
    - work-only
