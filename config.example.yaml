# Example configuration for LLM Gateway
#
# Copy to .config/config.yaml and adjust to your setup.
# Environment variables referenced with $VAR are resolved at boot.

server:
  port: 4000
  # data_dir: /config            # where tokens are stored
  #                               # Docker default: /config (same dir as this file)
  #                               # Local default: ~/.config/llmgateway

# ── Settings ────────────────────────────────────────────────
settings:
  # After a retryable upstream failure (5xx, 429, timeout, transport),
  # skip the failed provider and upstream model for this many seconds.
  # Client errors (4xx) advance the fallback chain but do not cool down.
  # Set 0 to disable cooldowns.
  cooldown_seconds: 60

# ── API Keys ────────────────────────────────────────────────
# Virtual keys for authenticating clients to the proxy.
# Models can be restricted to specific keys.
# An alias is available only when its configured key is authenticated.
# Alias values refer to public model names declared in `models`.
# Aliases do not chain through other aliases.
# An alias shadows an ordinary model with the same name for its key.
# Omit this section entirely to allow unauthenticated access.

keys:
  - name: dev
    value: $LLMGATEWAY_DEV_KEY
  - name: prod
    value: $LLMGATEWAY_PROD_KEY
    aliases:
      fast: gpt-4o-mini
      default: gpt-4o
      slow: claude-sonnet

