PUT 102.=114:
### Keys

Virtual API keys authenticate clients. Models without a `keys` field are accessible to all keys.

```yaml
keys:
  - name: personal-key
    value: $PERSONAL_KEY
    aliases:
      fast: deepseek-v4-flash
      default: gpt-4o-mini
      slow: glm-5-turbo
  - name: prod
    value: $LLMGATEWAY_PROD_KEY
```

Each alias maps a public alias ID to a public model ID declared in `models`. The alias is available only to its configured key. Aliases do not chain through other aliases. An alias shadows an ordinary model with the same name for that key. Keys without `aliases` keep their current behavior. The `name:model` model shorthand is a separate group-level alias feature.

Omit the `keys` section entirely to allow unauthenticated access.

# ── Providers ───────────────────────────────────────────────
# Each provider defines a connection to an upstream LLM service.
# `type` maps to a provider in llmdb.xyz — base URLs and auth
# styles are resolved automatically.
#
# The same provider type can appear multiple times with different
# names and credentials.

providers:
  - name: openrouter
    type: openrouter
    api_key: $OPENROUTER_API_KEY

  - name: openrouter-work
    type: openrouter
    api_key: $OPENROUTER_WORK_KEY

  - name: openai
    type: openai
    api_key: $OPENAI_API_KEY

  - name: anthropic
    type: anthropic
    api_key: $ANTHROPIC_API_KEY

  - name: copilot
    type: github_copilot
    # No api_key needed — uses GitHub device code flow automatically.
    # Tokens cached to data_dir/github_copilot/

  # Local Ollama (no auth required)
  - name: ollama
    type: ollama

# ── Models ──────────────────────────────────────────────────
# Each model maps a local name to an upstream provider model.
# Model metadata (context length, output limit, capabilities)
# is sourced automatically from llmdb.xyz.
#
# Every top-level entry is a group: its `provider`, optional `keys`, and optional
# `priority` apply to every child. Higher priority values are tried first.
# If priorities are equal or absent, YAML order applies. Child forms are:
#   - full mapping: explicit `name` and `model`
#   - `name:model`: alias shorthand
#   - `model`: bare upstream ID, also used as the public name
# The first colon separates the public name from the upstream ID; later
# colons remain in the upstream ID. Use a full mapping if a public name
# itself needs a colon.

models:
  - provider: openrouter-work
    keys: [prod]
    priority: 10
    models:
      # Full mapping: explicit public name and upstream ID.
      - name: deepseek-v4-flash
        model: deepseek/deepseek-v4-flash-0731
      # Shorthand: public name followed by upstream ID.
      - deepseek-v4-pro:deepseek/deepseek-v4-pro
      # Bare model ID: use it as both public name and upstream ID.
      - xiaomi/mimo-v2.5

  - provider: openai
    models:
      - gpt-4o-mini
      - gpt-4o

  - provider: anthropic
    models:
      - claude-sonnet:claude-sonnet-4-20250514
      - claude-haiku:claude-haiku-4-5-20251001

  # GitHub Copilot
  - provider: copilot
    models:
      - copilot-gpt4o:gpt-4o
      - copilot-claude:claude-sonnet-4

  # Local Ollama
  - provider: ollama
    models:
      - llama-local:llama3.2

# Fallbacks use public model names. At each name, the proxy tries every
# accessible deployment before it moves to the next named fallback. A retryable
# error or cooldown advances to the next deployment. Key access is checked per attempt.

fallbacks:
  deepseek/deepseek-chat: [claude-haiku, gpt-4o-mini]
  gpt-4o: [claude-sonnet]
  claude-sonnet: [gpt-4o]
  "*": [gpt-4o-mini]               # catch-all for models without specific fallbacks
