# Example configuration for LLM Gateway
#
# Copy to .config/config.yaml and adjust to your setup.
# Environment variables referenced with $VAR are resolved at boot.

server:
  port: 4000
  # data_dir: /config            # where tokens are stored
  #                               # Docker default: /config (same dir as this file)
  #                               # Local default: ~/.config/llmgateway

# ── Settings ────────────────────────────────────────────────
settings:
  # After a model fails with a retryable error, skip it for this
  # many seconds (0 disables the cooldown). Keyed by provider+model.
  cooldown_seconds: 60

# ── API Keys ────────────────────────────────────────────────
# Virtual keys for authenticating clients to the proxy.
# Models can be restricted to specific keys.
# Omit this section entirely to allow unauthenticated access.

keys:
  - name: dev
    value: $LLMGATEWAY_DEV_KEY
  - name: prod
    value: $LLMGATEWAY_PROD_KEY

# ── Providers ───────────────────────────────────────────────
# Each provider defines a connection to an upstream LLM service.
# `type` maps to a provider in llmdb.xyz — base URLs and auth
# styles are resolved automatically.
#
# The same provider type can appear multiple times with different
# names and credentials.

providers:
  - name: openrouter
    type: openrouter
    api_key: $OPENROUTER_API_KEY

  - name: openrouter-work
    type: openrouter
    api_key: $OPENROUTER_WORK_KEY

  - name: openai
    type: openai
    api_key: $OPENAI_API_KEY

  - name: anthropic
    type: anthropic
    api_key: $ANTHROPIC_API_KEY

  - name: copilot
    type: github_copilot
    # No api_key needed — uses GitHub device code flow automatically.
    # Tokens cached to data_dir/github_copilot/

  # Local Ollama (no auth required)
  - name: ollama
    type: ollama

# ── Models ──────────────────────────────────────────────────
# Each model maps a local name to an upstream provider model.
# Model metadata (context length, output limit, capabilities)
# is sourced automatically from llmdb.xyz.
#
# Models sharing a provider and access restriction can be grouped. The
# group-level `provider` and `keys` apply to every child. Child forms are:
#   - full mapping: explicit `name` and `model`
#   - `name:model`: alias shorthand
#   - `model`: bare upstream ID, also used as the public name
# The first colon separates the public name from the upstream ID; later
# colons remain in the upstream ID. Use a full mapping if a public name
# itself needs a colon.

models:
  - provider: openrouter-work
    keys: [prod]
    models:
      # Full mapping: explicit public name and upstream ID.
      - name: deepseek-v4-flash
        model: deepseek/deepseek-v4-flash-0731
      # Shorthand: public name followed by upstream ID.
      - deepseek-v4-pro:deepseek/deepseek-v4-pro
      # Bare model ID: use it as both public name and upstream ID.
      - xiaomi/mimo-v2.5

  # Flat mappings remain valid when a model needs its own provider or keys.
  - name: gpt-4o-mini
    provider: openai
    model: gpt-4o-mini

  - name: gpt-4o
    provider: openai
    model: gpt-4o
    keys: [prod]

  - name: claude-sonnet
    provider: anthropic
    model: claude-sonnet-4-20250514

  - name: claude-haiku
    provider: anthropic
    model: claude-haiku-4-5-20251001

  # GitHub Copilot
  - name: copilot-gpt4o
    provider: copilot
    model: gpt-4o

  - name: copilot-claude
    provider: copilot
    model: claude-sonnet-4

  # Local Ollama
  - name: llama-local
    provider: ollama
    model: llama3.2

# ── Fallbacks ───────────────────────────────────────────────
# When a model fails (5xx, timeout, rate limit), try the next
# model in the list. Key access is checked per-attempt.

fallbacks:
  deepseek/deepseek-chat: [claude-haiku, gpt-4o-mini]
  gpt-4o: [claude-sonnet]
  claude-sonnet: [gpt-4o]
  "*": [gpt-4o-mini]               # catch-all for models without specific fallbacks
